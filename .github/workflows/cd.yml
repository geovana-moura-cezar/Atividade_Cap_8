name: CD - Docker Hub e Azure

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao_residuos

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: gestao_residuos/pom.xml

      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes e gerar JAR
        run: ./mvnw -B clean verify

  build-push-image:
    name: Build e push da imagem Docker
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./gestao_residuos
          file: ./gestao_residuos/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gestao-residuos:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gestao-residuos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy - Staging
    needs: build-push-image
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Deploy do container no Azure App Service - Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestao-residuos:${{ github.sha }}

      - name: Smoke test do Swagger em staging
        shell: bash
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/v3/api-docs"
          for tentativa in {1..18}; do
            if curl --fail --silent --show-error "$URL" > /dev/null; then
              echo "Staging respondeu com sucesso."
              exit 0
            fi
            echo "Aguardando staging... tentativa $tentativa/18"
            sleep 10
          done
          exit 1

  deploy-production:
    name: Deploy - Producao
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Deploy da mesma imagem validada em staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestao-residuos:${{ github.sha }}

      - name: Smoke test do Swagger em producao
        shell: bash
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/v3/api-docs"
          for tentativa in {1..18}; do
            if curl --fail --silent --show-error "$URL" > /dev/null; then
              echo "Producao respondeu com sucesso."
              exit 0
            fi
            echo "Aguardando producao... tentativa $tentativa/18"
            sleep 10
          done
          exit 1
