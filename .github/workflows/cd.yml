name: CD - Docker Hub e Render

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao_residuos

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: gestao_residuos/pom.xml

      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes e gerar JAR
        run: ./mvnw -B clean verify

  build-push-image:
    name: Build e push da imagem Docker
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./gestao_residuos
          file: ./gestao_residuos/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gestao-residuos:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gestao-residuos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy - Staging
    needs: build-push-image
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.RENDER_SERVICE_URL }}

    steps:
      - name: Acionar deploy hook do Render - Staging
        run: |
          curl --fail --silent --show-error --request POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Aguardar e validar Swagger em staging
        shell: bash
        run: |
          URL="${{ vars.RENDER_SERVICE_URL }}/v3/api-docs"
          for tentativa in {1..30}; do
            if curl --fail --silent --show-error "$URL" > /dev/null; then
              echo "Staging respondeu com sucesso."
              exit 0
            fi
            echo "Aguardando staging... tentativa $tentativa/30"
            sleep 15
          done
          exit 1

  deploy-production:
    name: Deploy - Producao
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}

    steps:
      - name: Acionar deploy hook do Render - Producao
        run: |
          curl --fail --silent --show-error --request POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Aguardar e validar Swagger em producao
        shell: bash
        run: |
          URL="${{ vars.RENDER_SERVICE_URL }}/v3/api-docs"
          for tentativa in {1..30}; do
            if curl --fail --silent --show-error "$URL" > /dev/null; then
              echo "Producao respondeu com sucesso."
              exit 0
            fi
            echo "Aguardando producao... tentativa $tentativa/30"
            sleep 15
          done
          exit 1
