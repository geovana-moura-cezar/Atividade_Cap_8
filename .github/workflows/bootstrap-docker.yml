name: Publicar imagem Docker - Bootstrap

on:
  push:
    branches: ["devops-entrega"]
    paths:
      - ".github/workflows/bootstrap-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build e push no Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./gestao_residuos
          file: ./gestao_residuos/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gestao-residuos:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gestao-residuos:bootstrap
          cache-from: type=gha
          cache-to: type=gha,mode=max
