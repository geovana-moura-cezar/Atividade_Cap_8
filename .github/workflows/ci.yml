name: CI - Build e Testes

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build, testes e validacao Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao_residuos

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: gestao_residuos/pom.xml

      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar build e testes automatizados
        run: ./mvnw -B clean verify

      - name: Validar Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Construir imagem Docker
        run: docker build -t gestao-residuos:ci-${{ github.sha }} .

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: gestao_residuos/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
