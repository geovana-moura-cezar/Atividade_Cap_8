spring.application.name=gestao_residuos-test

spring.datasource.url=jdbc:h2:mem:gestao_residuos;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false

minha.chave.secreta=chave-de-teste-ci-com-pelo-menos-32-caracteres
logging.file.name=./target/test-logs/gestao-residuos-test.log
